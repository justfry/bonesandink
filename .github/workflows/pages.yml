name: Verify GitHub Pages build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages

      - name: Verify project asset paths
        run: |
          grep -q 'src="/bonesandink/assets/' pages-dist/index.html
          grep -q 'href="/bonesandink/assets/' pages-dist/index.html
          test -f pages-dist/hydra-favicon-white.svg
